name: projeto1-ci

on:
  push:
    paths: ["projeto1/**", ".github/workflows/projeto1-ci.yml"]
  pull_request:
    paths: ["projeto1/**", ".github/workflows/projeto1-ci.yml"]

permissions:
  contents: read

concurrency:
  group: projeto1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projeto1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ci_owner_password_only_for_ci
          POSTGRES_DB: projeto1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_SSL: disable
      DATABASE_ADMIN_URL: postgres://ci_owner:ci_owner_password_only_for_ci@localhost:5432/projeto1_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projeto1/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:content
      - name: Migrações e seed (banco efêmero de CI)
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:migrate
          PGPASSWORD=ci_owner_password_only_for_ci psql -h localhost -U ci_owner -d projeto1_test \
            -c "ALTER ROLE projeto1_app WITH LOGIN PASSWORD 'ci_app_password_only_for_ci'"
      - name: Testes (unitários + integração)
        env:
          TEST_DATABASE_URL: postgres://projeto1_app:ci_app_password_only_for_ci@localhost:5432/projeto1_test
          TEST_DATABASE_ADMIN_URL: postgres://ci_owner:ci_owner_password_only_for_ci@localhost:5432/projeto1_test
        run: npm test
      - run: npm run build
