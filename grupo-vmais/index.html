  <script>
    // Define o estado da abertura antes do primeiro paint (evita flash do conteúdo).
    (function () {
      var d = document.documentElement; d.className = d.className.replace('no-js', 'js');
      try {
        var force = /[?&]intro=1/.test(location.search);
        var seen = sessionStorage.getItem('vmais-intro');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if ((force || !seen) && !reduce && !location.hash) d.classList.add('has-intro');
      } catch (e) {}
      // Segurança: nunca bloquear o conteúdo se a animação falhar.
      setTimeout(function () { d.classList.remove('has-intro'); d.classList.add('intro-done'); }, 5000);
    })();
  </script>
